all:
  vars:
    # A list of users who will be added to the docker group.
    docker_users: [donutuse]
    # Action for Oh My Zsh
    ohmyzsh_action: "install"
    # Roles to be applied to all hosts
    global_roles:
      # - hello
      - sys-apt-upgrade
      - apt-packages
      - ohmyzsh
      - nerd-fonts
  children:
    ungrouped:
      hosts:
        # Server
        # pihole.onemarc.io:
        #   ansible_ssh_user: donutuse
        #   ansible_ssh_private_key_file: ~/.ssh/onemarc_rsa
        metalai.onemarc.io:
          ansible_ssh_user: donutuse
          ansible_ssh_private_key_file: ~/.ssh/onemarc_rsa
        hadesgate.onemarc.io:
          ansible_ssh_user: donutuse
          ansible_ssh_private_key_file: ~/.ssh/onemarc_rsa
