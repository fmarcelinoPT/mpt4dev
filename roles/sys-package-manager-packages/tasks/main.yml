---
# tasks file for sys-package-manager-packages

- name: Install `apt` packages (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    pkg:
      - snapd
      - net-tools
      - nano
      - parted
      - cockpit
      - unzip
      - git
    state: present
    update_cache: false
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Install `dnf` packages (RHEL/CentOS/Fedora)
  become: true
  ansible.builtin.dnf:
    name:
      - snapd
      - net-tools
      - nano
      - parted
      - cockpit
      - unzip
      - git
    state: present
  when: ansible_facts['pkg_mgr'] == 'dnf'

